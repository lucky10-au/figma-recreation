<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Figma Recreation — iOS Toolbar (SF Symbols)</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #f9f9f9;
        --pill: #ffffff;
        --pill-border: #ebebeb;
        --label-primary: #1a1a1a;
        --label-secondary: #727272;
      }
      body {
        background: var(--bg);
        font-family:
          "SF Pro",
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          "Helvetica Neue",
          sans-serif;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        min-height: 100vh;
        padding: 0;
        -webkit-font-smoothing: antialiased;
      }
      .canvas {
        width: 100%;
        max-width: 1440px;
        height: 100vh;
        min-height: 900px;
        background: var(--bg);
        border-radius: 0;
        position: relative;
        overflow: hidden;
        box-shadow: none;
      }
      /* SF Symbol glyphs — must use SF Pro, not SVG */
      .sf {
        font-family:
          "SF Pro",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        font-weight: 510;
        -webkit-font-smoothing: antialiased;
        line-height: 1;
        display: inline-block;
      }
      .topbar {
        position: absolute;
        left: 17px;
        right: 17px;
        top: 23px;
        z-index: 10;
        height: 42px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .top-left,
      .top-right {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1;
      }
      .top-right {
        justify-content: flex-end;
      }
      .pill {
        background: #fff;
        box-shadow: 0 0 0 0.4px #ebebeb;
        border-radius: 999px;
        height: 36px;
        display: flex;
        align-items: center;
        padding: 0 6px;
      }
      .pill.menu {
        padding: 0 12px 0 8px;
        gap: 4px;
        font-size: 13.77px;
        font-weight: 510;
        color: #1a1a1a;
      }
      .pill.menu {
        position: relative;
        cursor: pointer;
      }
      #menupop {
        left: 0;
        transform: none;
        text-align: left;
      }
      .pop a.pop-item {
        display: block;
        color: #1a1a1a;
        text-decoration: none;
      }
      .pill.menu .sf {
        font-size: 13.77px;
        font-weight: 590;
      }
      .pill.group {
        padding: 0 8px;
        gap: 2px;
      }
      .icon-btn {
        width: 30px;
        height: 30px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #000;
      }
      .icon-btn .sf {
        font-size: 13.77px;
      }
      .title-center {
        position: absolute;
        left: 50%;
        top: 2px;
        transform: translateX(-50%);
        text-align: center;
        line-height: 1.15;
        pointer-events: none;
      }
      .title-center h1 {
        font-size: 20px;
        font-weight: 590;
        color: #1a1a1a;
        letter-spacing: -0.2px;
      }
      .title-center p {
        font-size: 10px;
        font-weight: 510;
        color: #727272;
        margin-top: 2px;
      }
      .circle-btn {
        width: 36px;
        height: 36px;
        background: #fff;
        box-shadow: 0 0 0 0.4px #ebebeb;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #727272;
      }
      .circle-btn .sf {
        font-size: 13.77px;
      }
      .search-pill {
        width: 146px;
        height: 36px;
        background: #fff;
        box-shadow: 0 0 0 0.4px #ebebeb;
        border-radius: 999px;
        display: flex;
        align-items: center;
        padding: 0 10px 0 12px;
        gap: 6px;
        color: rgba(60, 60, 67, 0.6);
        font-size: 13px;
      }
      .search-pill .sf {
        font-size: 13px;
      }
      .search-pill .ph {
        color: #bfbfbf;
        flex: 1;
        font-weight: 510;
      }

      .center-stack {
        z-index: 10;
        position: absolute;
        left: 50%;
        top: 74px;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .segmented {
        background: #e9e9ee;
        border-radius: 100px;
        height: 50px;
        padding: 2px;
        display: flex;
        align-items: stretch;
        gap: 4px;
      }
      .seg-item {
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 1000px;
        color: #000;
        min-width: 46px;
        padding: 0 6px;
        cursor: pointer;
        border: 0;
        background: transparent;
        font: inherit;
        position: relative;
      }
      .seg-item .sf {
        font-size: 20px;
        line-height: 18px;
      }
      .seg-item.selected {
        background: #fff;
        box-shadow: 0 2px 20px rgba(0, 0, 0, 0.06);
      }
      .seg-item:not(.selected):hover {
        background: #f4f4f6;
      }
      .row2 {
        display: flex;
        justify-content: center;
      }
      #tool-settings {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      #tool-settings:empty {
        display: none;
      }
      #tool-settings > .segmented > .seg-item {
        font-weight: 600;
        font-size: 15px;
        color: #000;
      }
      #tool-settings .fmt-b {
        font-weight: 800;
      }
      .color-dot {
        width: 28px;
        height: 28px;
        border-radius: 9999px;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(
            ellipse 50% 50% at 50% 50%,
            #e4e4e4 0%,
            rgba(228, 228, 228, 0) 88%
          ),
          conic-gradient(
            from 0deg at 50% 50%,
            #e7e040 0deg,
            #eeaa3c 45deg,
            #e8403b 90deg,
            #b33ed5 132deg,
            #694ae8 182deg,
            #3ccae7 231deg,
            #3ce885 270deg,
            #89e743 313deg,
            #e7e040 360deg
          );
      }
      .pip {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        box-shadow: 0 0 0 1.5px #fff;
      }
      .slider-pill {
        background: #fff;
        border-radius: 1000px;
        height: 46px;
        display: flex;
        align-items: center;
        padding: 0 18px 0 14px;
        gap: 12px;
        box-shadow: 0 2px 20px rgba(0, 0, 0, 0.06);
        min-width: 176px;
      }
      .slider-pill .sf {
        font-size: 20px;
        color: #000;
      }
      .slider-track {
        width: 112px;
        height: 6px;
        background: rgba(120, 120, 120, 0.2);
        border-radius: 3px;
        position: relative;
      }
      .slider-fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 75%;
        background: #0088ff;
        border-radius: 3px;
      }
      .slider-thumb {
        position: absolute;
        left: 75%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 38px;
        height: 24px;
        background: #fff;
        border-radius: 100px;
        box-shadow:
          0 6px 13px rgba(0, 0, 0, 0.12),
          0 0.5px 4px rgba(0, 0, 0, 0.12);
      }
      .shp {
        width: 20px;
        height: 20px;
        box-sizing: border-box;
      }
      .shp-sq {
        border: 2.5px solid #000;
        border-radius: 4px;
      }
      .shp-ci {
        border: 2.5px solid #000;
        border-radius: 50%;
      }
      .shp-tr {
        width: 0;
        height: 0;
        border-left: 11px solid transparent;
        border-right: 11px solid transparent;
        border-bottom: 19px solid #000;
      }
      .shp-di {
        border: 2.5px solid #000;
        border-radius: 4px;
        transform: rotate(45deg) scale(0.78);
      }
      .shp-ln {
        width: 20px;
        height: 3px;
        background: #000;
        border-radius: 2px;
      }
      .solid-dot {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.2);
      }
      .fmt {
        font-size: 15px;
      }
      .fmt-b {
        font-weight: 800;
      }
      .fmt-i {
        font-style: italic;
        font-weight: 400;
      }
      .fmt-u {
        text-decoration: underline;
      }
      .step-btn {
        min-width: 28px;
        font-size: 16px;
      }
      .swatches {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 0 6px;
      }
      .swatch {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        cursor: pointer;
        box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.15);
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      .swatch.sel {
        box-shadow: 0 0 0 2px #007aff;
      }
      .nativepick {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: pointer;
        padding: 0;
        border: 0;
        background: none;
      }
      .pop {
        position: absolute;
        top: calc(100% + 10px);
        left: 50%;
        transform: translateX(-50%);
        background: #fff;
        border-radius: 14px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.16);
        padding: 6px;
        z-index: 20;
        min-width: 160px;
      }
      .pop-item {
        padding: 8px 10px;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
        white-space: nowrap;
      }
      .pop-item:hover {
        background: rgba(118, 118, 128, 0.12);
      }
      .pop-item.sel {
        background: rgba(0, 122, 255, 0.12);
      }
      .pop-swatches {
        display: grid;
        grid-template-columns: repeat(4, 28px);
        gap: 8px;
        padding: 6px;
      }
      #draw-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #draw-layer path {
        pointer-events: none;
      }
      #world {
        position: absolute;
        inset: 0;
        z-index: 0;
      }
      .topfade {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 280px;
        z-index: 5;
        background: linear-gradient(
          180deg,
          #f9f9f9 0%,
          rgba(249, 249, 249, 0.92) 45%,
          rgba(249, 249, 249, 0) 100%
        );
        pointer-events: none;
      }
      #object-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .note {
        position: absolute;
        width: 180px;
        min-height: 150px;
        padding: 12px;
        border-radius: 4px 4px 16px 4px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
        pointer-events: auto;
      }
      .note.selected {
        box-shadow:
          0 0 0 2px #007aff,
          0 8px 24px rgba(0, 0, 0, 0.14);
      }
      .note .txt {
        outline: none;
        word-break: break-word;
        min-height: 120px;
      }
      .tbox {
        position: absolute;
        min-width: 40px;
        max-width: 60%;
        padding: 6px 8px;
        pointer-events: auto;
      }
      .tbox.selected {
        box-shadow: 0 0 0 2px #007aff;
        border-radius: 6px;
      }
      .tbox .txt {
        outline: none;
        word-break: break-word;
        white-space: pre-wrap;
      }
    </style>
    <style>
      /* responsive-rescale whiteboard */
      html,
      body {
        height: 100%;
      }
      body {
        display: block !important;
        min-height: 0 !important;
        height: 100vh !important;
        overflow: hidden !important;
      }
      .canvas {
        width: 100% !important;
        max-width: none !important;
        height: 100vh !important;
        min-height: 0 !important;
        overflow: hidden !important;
      }
      .center-stack {
        max-width: calc(100vw - 16px);
      }
      #tool-settings {
        max-width: calc(100vw - 16px);
        overflow-x: auto;
        scrollbar-width: none;
      }
      .segmented {
        max-width: 100%;
      }
      @media (max-width: 700px) {
        .topbar {
          position: static !important;
          margin: 12px;
          flex-wrap: wrap;
          height: auto;
        }
        .top-left {
          flex-wrap: wrap;
        }
        .search-pill {
          width: 120px;
        }
        .title-center {
          position: static !important;
          transform: none !important;
          margin: 8px auto;
          text-align: center;
          order: 3;
          width: 100%;
        }
        .center-stack {
          position: static !important;
          transform: none !important;
          margin: 8px auto;
        }
        #world {
          position: absolute;
        }
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div id="world">
        <svg
          id="draw-layer"
          viewBox="0 0 1440 900"
          preserveAspectRatio="none"
        ></svg>
        <div id="object-layer"></div>
      </div>
      <div class="topfade"></div>
      <div class="topbar">
        <div class="top-left">
          <a class="pill menu" href="home.html"
            ><span class="sf">􀯶</span><span>Menu</span></a
          >
          <div class="pill group">
            <div class="icon-btn"><span class="sf">􀉈</span></div>
            <div class="icon-btn"><span class="sf">􀉁</span></div>
            <div class="icon-btn"><span class="sf">􀉃</span></div>
          </div>
          <div class="pill" style="width: 36px; justify-content: center">
            <div class="icon-btn"><span class="sf">􀈑</span></div>
          </div>
        </div>
        <div class="title-center">
          <h1>Whiteboard</h1>
          <p>Untitled board</p>
        </div>
        <div class="top-right">
          <div class="circle-btn"><span class="sf">􀱍</span></div>
          <div class="circle-btn"><span class="sf">􀱓</span></div>
          <div class="search-pill">
            <span class="sf">􀊫</span><span class="ph">Search</span
            ><span class="sf">􀊰</span>
          </div>
        </div>
      </div>

      <div class="center-stack">
        <div
          class="segmented"
          id="tool-switcher"
          style="width: 251px"
          role="tablist"
          aria-label="Tools"
        >
          <button
            class="seg-item"
            data-tool="0"
            role="tab"
            aria-selected="false"
            title="Select"
          >
            <span class="sf">􀫌</span>
          </button>
          <button
            class="seg-item"
            data-tool="1"
            role="tab"
            aria-selected="false"
            title="Sticky"
          >
            <span class="sf">􀈷</span>
          </button>
          <button
            class="seg-item"
            data-tool="2"
            role="tab"
            aria-selected="false"
            title="Text"
          >
            <span class="sf">􂐦</span>
          </button>
          <button
            class="seg-item"
            data-tool="3"
            role="tab"
            aria-selected="false"
            title="Shapes"
          >
            <span class="sf">􀐉</span>
          </button>
          <button
            class="seg-item selected"
            data-tool="4"
            role="tab"
            aria-selected="true"
            title="Draw"
          >
            <span class="sf">􀉥</span>
          </button>
        </div>
        <div class="row2">
          <div id="tool-settings"></div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var CHEV = "􀆈";
        var FONTS = ["SF Pro", "Inter", "New York", "Menlo"];
        var SHAPES = [
          { id: "sq", label: "Square" },
          { id: "ci", label: "Circle" },
          { id: "tr", label: "Triangle" },
          { id: "di", label: "Diamond" },
          { id: "ln", label: "Line" },
        ];
        var CURSORS = ["grab", "text", "text", "crosshair", "crosshair"];
        var state = {
          tool: 4,
          size: [0, 50, 50, 60, 75], // persistent slider per tool (index 0 unused)
          shape: 0,
          drawStyle: 0,
          drawColor: "#000000",
          shapeColor: "#000000",
          text: {
            font: "Inter",
            size: 16,
            color: "#000000",
            b: false,
            i: false,
            u: false,
            open: null,
          },
          sticky: {
            font: "Inter",
            size: 16,
            color: "#000000",
            b: false,
            i: false,
            u: false,
            fill: "#FFE57A",
            open: null,
          },
          noteSeq: 0,
          selNote: null,
        };
        var switcher = document.getElementById("tool-switcher");
        var settings = document.getElementById("tool-settings");
        var buttons = Array.prototype.slice.call(
          switcher.querySelectorAll("[data-tool]"),
        );
        var canvas = document.querySelector(".canvas");
        var objLayer = document.getElementById("object-layer");
        function applyTextStyle(txt, m) {
          txt.style.fontFamily = "'" + m.font + "', -apple-system, sans-serif";
          txt.style.fontSize = m.size + "px";
          txt.style.color = m.color;
          txt.style.fontWeight = m.b ? "800" : "400";
          txt.style.fontStyle = m.i ? "italic" : "normal";
          txt.style.textDecoration = m.u ? "underline" : "none";
        }
        function syncSelectedNote() {
          if (!state.selNote) return;
          var note = objLayer.querySelector(
            '[data-id="' + state.selNote + '"]',
          );
          if (!note) {
            state.selNote = null;
            return;
          }
          note.style.background = state.sticky.fill;
          applyTextStyle(note.querySelector(".txt"), state.sticky);
        }
        function markSelected(id) {
          state.selNote = id;
          Array.prototype.forEach.call(
            objLayer.querySelectorAll(".note, .tbox"),
            function (n) {
              n.classList.toggle("selected", n.getAttribute("data-id") === id);
            },
          );
        }
        function placeText(xPct, yPct) {
          state.noteSeq += 1;
          var box = document.createElement("div");
          box.className = "tbox";
          box.setAttribute("data-id", "n" + state.noteSeq);
          box.style.left = Math.min(Math.max(xPct, 0), 90) + "%";
          box.style.top = Math.min(Math.max(yPct, 0), 90) + "%";
          var txt = document.createElement("div");
          txt.className = "txt";
          txt.contentEditable = "true";
          txt.textContent = "Text";
          box.appendChild(txt);
          objLayer.appendChild(box);
          applyTextStyle(txt, state.text);
          clearStrokeSel();
          markSelected(box.getAttribute("data-id"));
          txt.focus();
          try {
            var range = document.createRange();
            range.selectNodeContents(txt);
            var sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
          } catch (err) {}
        }
        function canvasPct(e) {
          var r = objLayer.getBoundingClientRect();
          return {
            x: ((e.clientX - r.left) / r.width) * 100,
            y: ((e.clientY - r.top) / r.height) * 100,
          };
        }
        function placeSticky(xPct, yPct) {
          state.noteSeq += 1;
          var note = document.createElement("div");
          note.className = "note";
          note.setAttribute("data-id", "n" + state.noteSeq);
          note.style.left = Math.min(Math.max(xPct, 0), 86) + "%";
          note.style.top = Math.min(Math.max(yPct, 0), 76) + "%";
          note.style.background = state.sticky.fill;
          var txt = document.createElement("div");
          txt.className = "txt";
          txt.contentEditable = "true";
          txt.textContent = "New note";
          note.appendChild(txt);
          objLayer.appendChild(note);
          applyTextStyle(txt, state.sticky);
          markSelected(note.getAttribute("data-id"));
          txt.focus();
          try {
            var range = document.createRange();
            range.selectNodeContents(txt);
            var sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
          } catch (err) {}
        }
        function uiCutoff() {
          var cr = canvas.getBoundingClientRect();
          var cut = 0;
          var tb = document.querySelector(".topbar");
          var cs = document.querySelector(".center-stack");
          if (tb)
            cut = Math.max(cut, tb.getBoundingClientRect().bottom - cr.top);
          if (cs)
            cut = Math.max(cut, cs.getBoundingClientRect().bottom - cr.top);
          return cut + 8;
        }
        function inUiZone(e) {
          return e.clientY - canvas.getBoundingClientRect().top < uiCutoff();
        }
        canvas.addEventListener("pointerdown", function (e) {
          if (
            inUiZone(e) ||
            e.target.closest(".note, .tbox, .center-stack, .topbar")
          )
            return;
          if (state.tool === 1)
            placeSticky.apply(null, [canvasPct(e).x, canvasPct(e).y]);
          else if (state.tool === 2) {
            var pt = canvasPct(e);
            placeText(pt.x, pt.y);
          } else if (state.tool === 0) markSelected(null);
        });
        objLayer.addEventListener("pointerdown", function (e) {
          var note = e.target.closest(".note, .tbox");
          if (!note || state.tool !== 0) return;
          markSelected(note.getAttribute("data-id"));
          var r = objLayer.getBoundingClientRect();
          var nr = note.getBoundingClientRect();
          var dx = e.clientX - nr.left,
            dy = e.clientY - nr.top;
          try {
            note.setPointerCapture(e.pointerId);
          } catch (err) {}
          var move = function (ev) {
            var nx = ((ev.clientX - r.left - dx) / r.width) * 100;
            var ny = ((ev.clientY - r.top - dy) / r.height) * 100;
            note.style.left = Math.min(Math.max(nx, -8), 97) + "%";
            note.style.top = Math.min(Math.max(ny, 0), 96) + "%";
          };
          var up = function () {
            note.removeEventListener("pointermove", move);
            note.removeEventListener("pointerup", up);
            note.removeEventListener("pointercancel", up);
          };
          note.addEventListener("pointermove", move);
          note.addEventListener("pointerup", up);
          note.addEventListener("pointercancel", up);
        });
        var view = { x: 0, y: 0 };
        var world = document.getElementById("world");

              " 0 1 0 " +
              f(cx + rx) +
              " " +
              f(cy) +
              " A " +
              f(rx) +
              " " +
              f(ry) +
              " 0 1 0 " +
              f(cx - rx) +
              " " +
              f(cy) +
              " Z"
            );
          }
          if (kind === 2)
            return (
              "M " +
              f(cx) +
              " " +
              f(ya) +
              " L " +
              f(xb) +
              " " +
              f(yb) +
              " L " +
              f(xa) +
              " " +
              f(yb) +
              " Z"
            );
          if (kind === 3)
            return (
              "M " +
              f(cx) +
              " " +
              f(ya) +
              " L " +
              f(xb) +
              " " +
              f(cy) +
              " L " +
              f(cx) +
              " " +
              f(yb) +
              " L " +
              f(xa) +
              " " +
              f(cy) +
              " Z"
            );
          return "M " + f(x1) + " " + f(y1) + " L " + f(x2) + " " + f(y2);
        }
        layer.addEventListener("pointerdown", function (e) {
          if (state.tool !== 3) return;
          e.preventDefault();
          try {
            layer.setPointerCapture(e.pointerId);
          } catch (err) {}
          var start = svgPos(e);
          var kind = state.shape;
          var el = document.createElementNS(NS, "path");
          state.strokeSeq = (state.strokeSeq || 0) + 1;
          el.setAttribute("data-id", "s" + state.strokeSeq);
          el.setAttribute(
            "d",
            shapePath(kind, start.x, start.y, start.x + 1, start.y + 1),
          );
          el.setAttribute("fill", "none");
          el.setAttribute("stroke", state.shapeColor);
          el.setAttribute("stroke-width", shapeWidth().toFixed(1));
          el.setAttribute("stroke-linecap", kind === 4 ? "round" : "square");
          el.setAttribute("stroke-linejoin", "miter");
          layer.appendChild(el);
          var cur = { x: start.x, y: start.y };
          var move = function (ev) {
            cur = svgPos(ev);
            var ax = start.x,
              ay = start.y,
              bx = cur.x,
              by = cur.y;
            if (ev.shiftKey && (kind === 0 || kind === 1)) {
              var w = Math.abs(bx - ax),
                h = Math.abs(by - ay);
              var m = Math.max(w, h);
              bx = ax + (bx < ax ? -m : m);
              by = ay + (by < ay ? -m : m);
            }
            el.setAttribute("d", shapePath(kind, ax, ay, bx, by));
          };
          var up = function () {
            var done = shapePath(kind, start.x, start.y, cur.x, cur.y);
            if (kind === 4) {
              var len = Math.hypot(cur.x - start.x, cur.y - start.y);
              if (len < 8) {
                el.remove();
              }
            } else if (
              Math.abs(cur.x - start.x) < 8 ||
              Math.abs(cur.y - start.y) < 8
            ) {
              var cx = start.x,
                cy = start.y;
              el.setAttribute(
                "d",
                shapePath(kind, cx - 60, cy - 45, cx + 60, cy + 45),
              );
            } else {
              el.setAttribute("d", done);
            }
            if (el.parentNode) selectStroke(el);
            layer.removeEventListener("pointermove", move);
            layer.removeEventListener("pointerup", up);
            layer.removeEventListener("pointercancel", up);
          };
          layer.addEventListener("pointermove", move);
          layer.addEventListener("pointerup", up);
          layer.addEventListener("pointercancel", up);
        });
        layer.addEventListener("pointerdown", function (e) {
          if (state.tool !== 4) return;
          e.preventDefault();
          try {
            layer.setPointerCapture(e.pointerId);
          } catch (err) {}
          var p = svgPos(e);
          current = document.createElementNS(NS, "path");
          state.strokeSeq = (state.strokeSeq || 0) + 1;
          current.setAttribute("data-id", "s" + state.strokeSeq);
          current.setAttribute(
            "d",
            "M " + p.x.toFixed(1) + " " + p.y.toFixed(1),
          );
          current.setAttribute("fill", "none");
          current.setAttribute("stroke", state.drawColor);
          current.setAttribute("stroke-width", strokeWidth().toFixed(1));
          current.setAttribute("stroke-linecap", "round");
          current.setAttribute("stroke-linejoin", "round");
          if (state.drawStyle === 1) current.setAttribute("opacity", "0.45");
          layer.appendChild(current);
          var move = function (ev) {
            if (!current) return;
            var q = svgPos(ev);
            current.setAttribute(
              "d",
              current.getAttribute("d") +
                " L " +
                q.x.toFixed(1) +
                " " +
                q.y.toFixed(1),
            );
          };
          var up = function () {
            current = null;
            layer.removeEventListener("pointermove", move);
            layer.removeEventListener("pointerup", up);
            layer.removeEventListener("pointercancel", up);
          };
          layer.addEventListener("pointermove", move);
          layer.addEventListener("pointerup", up);
          layer.addEventListener("pointercancel", up);
        });
        (function () {
          state.noteSeq = 1;
          var sn = document.createElement("div");
          sn.className = "note";
          sn.setAttribute("data-id", "n1");
          sn.style.left = "6%";
          sn.style.top = "24%";
          sn.style.background = "#FFE57A";
          var st = document.createElement("div");
          st.className = "txt";
          st.contentEditable = "false";
          st.textContent = "Methods revision";
          st.style.fontFamily = "'Inter',-apple-system,sans-serif";
          st.style.fontSize = "28px";
          st.style.fontWeight = "800";
          st.style.color = "#000";
          sn.appendChild(st);
          objLayer.appendChild(sn);
        })();
        select(4); // Draw is selected in the design
      })();
    </script>
  </body>
</html>
